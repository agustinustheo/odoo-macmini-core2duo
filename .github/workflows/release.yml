name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl
      - name: Test
        run: cargo test --locked
      # Baseline x86-64 (no target-cpu flags) so it runs on the Core 2 Duo.
      - name: Build static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Check
        run: |
          B=target/x86_64-unknown-linux-musl/release/odoo-cli
          file "$B" | grep -q 'static'
          "$B" --version
          cp "$B" odoo-cli-x86_64-linux
          sha256sum odoo-cli-x86_64-linux > odoo-cli-x86_64-linux.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" odoo-cli-x86_64-linux odoo-cli-x86_64-linux.sha256 \
            --title "$GITHUB_REF_NAME" --notes "Static x86-64 Linux binary. See README for setup." \
            || gh release upload "$GITHUB_REF_NAME" odoo-cli-x86_64-linux odoo-cli-x86_64-linux.sha256 --clobber
