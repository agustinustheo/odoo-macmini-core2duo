[package]
name = "odoo-cli"
version = "0.2.0"
edition = "2021"
description = "Single-binary Odoo CLI for agents and humans, built for an old Core 2 Duo Mac mini"
license = "AGPL-3.0-only"
authors = ["Agustinus Theodorus <agustinustheoo@gmail.com>"]
repository = "https://github.com/agustinustheo/odoo-macmini-core2duo"
readme = "README.md"
keywords = ["odoo", "erp", "cli", "agents"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "odoo-cli"
path = "src/main.rs"

[dependencies]
# Blocking HTTP, no async runtime. rustls + bundled webpki roots, so the static
# binary needs no OpenSSL and no system certificate store.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
